version: '3.8'

services:   
  frontend:
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - VITE_API_URL=${BACKEND_DEV_API_URL}

  backend:
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - FLASK_MODE=development
      - DATABASE_URL=mysql+pymysql://root:Admin123%40@db/madb8?charset=utf8mb4

  
  db:
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "3307:3306" 
    

  rabbitmq:
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
      
 
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network