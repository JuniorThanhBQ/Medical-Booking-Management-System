version: '3.8'

services:   
  frontend:
    ports:
      - "${VITE_PORT}:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL}

  backend:
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FLASK_MODE=production
      - DATABASE_URL=mysql+pymysql://root:admin123@db:3306/madb8?charset=utf8mb4
      - RABBITMQ_URL=amqp://${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0

    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
      - ./.env:/app/src/.env
      - ./database/migrations:/app/migrations
      
    command: >
      bash -c "export PYTHONPATH=/app &&
               flask --app src.index:app db upgrade &&
               python src/fixtures/fixtures.py &&
               gunicorn --workers=4 --bind=0.0.0.0:8000 --access-logfile=- --error-logfile=- src.index:app"

  db:
    ports:
      - "${DB_PORT}:3306" 
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql

  redis:
    volumes:
      - redis-data:/data

  rabbitmq:
    ports:
      - "${RABBITMQ_WEB_PORT}:15672"
      - "${RABBITMQ_PORT}:5672"
 
  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy