worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    upstream backend {
        server backend:8000;
        keepalive 32;
    }
    
    map $http_origin $cors_origin {
        default "";
        "http://localhost:5173" $http_origin;        
        "~^https://(www\.)?frontend-domain\.com$" $http_origin;
    }

    map $uri $cors_origin_header {
        ~^/api/ $cors_origin;
        default "";
    }

    map $uri $cors_creds_header {
        ~^/api/ "true";
        default "";
    }

    map "$uri:$request_method" $cors_methods_header {
        ~^/api/.*:OPTIONS$ "GET, POST, PATCH, DELETE, OPTIONS";
        default "";
    }

    map "$uri:$request_method" $cors_headers_header {
        ~^/api/.*:OPTIONS$ "Authorization, Content-Type, X-CSRFToken";
        default "";
    }

    map "$uri:$request_method" $cors_max_age_header {
        ~^/api/.*:OPTIONS$ 1728000;
        default "";
    }

    map $uri $cache_control_header {
        "~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" "public, immutable";
        "~^/cloudinary/" "public, no-transform";
        default "public, must-revalidate";
    }

    map $uri $proxy_cache_header {
        ~^/cloudinary/ $upstream_cache_status;
        default "";
    }

    map $uri $csp_header {
        ~^/(login|logout|admin|api/v2/docs|static) "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com; connect-src 'self' http://localhost:8000;";        
        default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com; connect-src 'self' http://localhost:8000;";
    }

    proxy_cache_path /var/cache/nginx/cloudinary levels=1:2 keys_zone=cloudinary_cache:10m max_size=5g inactive=30d use_temp_path=off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        
        server_name _;
        
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        add_header Cache-Control $cache_control_header always;
        add_header Access-Control-Allow-Origin $cors_origin_header always;
        add_header Access-Control-Allow-Credentials $cors_creds_header always;
        add_header Access-Control-Allow-Methods $cors_methods_header always;
        add_header Access-Control-Allow-Headers $cors_headers_header always;
        add_header Access-Control-Max-Age $cors_max_age_header always;
        add_header X-Proxy-Cache $proxy_cache_header always;
        add_header Content-Security-Policy $csp_header always;

        location ~ ^/(login|logout|admin|api/v2/docs|static|swaggerui) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;

            proxy_http_version 1.1;
        }       

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 365d;
            access_log off;
        }

         location / {
            try_files $uri $uri/ /index.html;
            expires 1d;
        }
        
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* ^/cloudinary/(.+\.(jpg|jpeg|png|webp|gif|svg|avif))$ {
            proxy_cache cloudinary_cache;
            proxy_cache_key "$host$request_uri";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1h;

            rewrite ^/cloudinary/(.*)$ /$1 break;
            proxy_pass https://res.cloudinary.com;
            
            proxy_ssl_server_name on;
            proxy_set_header Host res.cloudinary.com;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            expires 30d;            
        }
    }
}