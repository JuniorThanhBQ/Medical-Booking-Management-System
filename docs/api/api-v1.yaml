          properties:
            title:
              type: string
            description:
              type: string
            start_time:
              type: string
            end_time:
              type: string
            work_date:
              type: array
              description: "Các thứ làm việc trong tuần. Phần này phức tạp nên có gì Phát nhắn hỏi mình nếu khó hiểu nhé."
              items:
                type: string
                enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]                
