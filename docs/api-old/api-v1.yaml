openapi: 3.0.0
info:
  title: Medical Appointment B3 API
  version: v1
  description: API for Medical Appointment System B3
servers:
  - url: /api/v1
    description: Base URL for API v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Các API xác thực và tài khoản
  - name: Appointments
    description: Các API lịch hẹn
  - name: Doctors
    description: Các API liên quan đến lịch làm việc bác sĩ
  - name: Medical Records
    description: Các API của hồ sơ khám bệnh
  - name: Notifications
    description: Các API của thông báo
  - name: Public
    description: Các API không cần đăng nhập
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [PATIENT, DOCTOR, RECEPTIONIST, ADMIN]
        createdAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      properties:
        id:
          type: integer
        address:
          type: string
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER, NOT_SET]
        avatar:
          type: string
        medicalHistory:
          type: string
        title:
          type: string
        bio:
          type: string
        specialty:
          $ref: "#/components/schemas/Specialty"
    Specialty:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        level:
          type: string
        ctaLabel:
          type: string
          enum: [CK1, CK2, CK3]
    Appointment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        patientName:
          type: string
        doctorName:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, COMPLETED, CANCEL]
        appointmentDate:
          type: string
          format: date-time
        note:
          type: string
    MedicalRecord:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [CK1, CK2, CK3]
        appointmentId:
          type: string
        patientName:
          type: string
        doctorName:
          type: string
        specialty:
          type: string
        status:
          type: string
          enum: [DONE, FOLLOW_UP]
        diagnosis:
          type: string
        notes:
          type: string
        prescriptionText:
          type: string
        treatmentOrders:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    WorkSchedule:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        workDate:
          type: array
          items:
            type: string
            enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        pages:
          type: integer
        currentPage:
          type: integer
        perPage:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [PATIENT, DOCTOR, RECEPTIONIST, ADMIN]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  access_token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - dayOfBirth
                - gender
                - phone
                - address
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                dayOfBirth:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, NOT_SET]
                phone:
                  type: string
                address:
                  type: string
                medicalHistory:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/email-validator:
    post:
      tags:
        - Auth
      summary: Xác thực Email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Email available
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_valid:
                    type: boolean
        "400":
          description: Email exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_valid:
                    type: boolean
  /auth/current-user:
    get:
      tags:
        - Auth
      summary: Lấy thông tin user đã đăng nhập
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
    patch:
      tags:
        - Auth
      summary: Cập nhật thông tin user đã đăng nhập 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                dayOfBirth:
                  type: string
                  format: date
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, NOT_SET]
                phone:
                  type: string
                address:
                  type: string
                medicalHistory:
                  type: string
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Update successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /appointments:
    get:
      tags:
        - Appointments
      summary: Danh sách lịch hẹn
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags:
        - Appointments
      summary: Tạo lịch hẹn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - doctorId
                - appointmentDate
              properties:
                doctorId:
                  type: integer
                appointmentDate:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /appointments/{appointment_id}:
    get:
      tags:
        - Appointments
      summary: Chi tiết lịch hẹn
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Appointments
      summary: Cập nhật lịch hẹn
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, APPROVED, COMPLETED, CANCEL]
                note:
                  type: string
                appointmentDate:
                  type: string
                  format: date-time
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Appointments
      summary: Xóa lịch hẹn
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /appointments/{appointment_id}/patient-profile:
    get:
      tags:
        - Appointments
      summary: Lấy hồ sơ bệnh nhân
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                  lastName:
                    type: string
                  dateOfBirth:
                    type: string
                    format: date
                  gender:
                    type: string
                    enum: [MALE, FEMALE, OTHER, NOT_SET]
                  phone:
                    type: string
                  address:
                    type: string
                  avatar:
                    type: string
                  medicalHistory:
                    type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /appointments/receptionist-appointments:
    post:
      tags:
        - Appointments
      summary: Tạo lịch hẹn (Lễ tân)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - doctorId
                - appointmentDate
                - firstName
                - lastName
                - phone
                - gender
                - birthday
                - address
              properties:
                doctorId:
                  type: integer
                appointmentDate:
                  type: string
                  format: date-time
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                gender:
                  type: string
                  enum: [MALE, FEMALE, OTHER, NOT_SET]
                birthday:
                  type: string
                  format: date
                address:
                  type: string
                note:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /doctors/my-schedule:
    get:
      tags:
        - Doctors
      summary: Lịch làm việc
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  workSchedule:
                    $ref: "#/components/schemas/WorkSchedule"
                  appointments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Appointment"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /doctors/schedule-requests:
    post:
      tags:
        - Doctors
      summary: Xin đổi lịch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newWorkSchedule
              properties:
                newWorkSchedule:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    start_time:
                      type: string
                      format: time
                    end_time:
                      type: string
                      format: time
                    work_date:
                      type: array
                      items:
                        type: string
                        enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /medical-records/{medical_record_id}:
    get:
      tags:
        - Medical Records
      summary: Chi tiết hồ sơ y tế
      parameters:
        - name: medical_record_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Medical Records
      summary: Cập nhật hồ sơ y tế
      parameters:
        - name: medical_record_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diagnosis:
                  type: string
                prescriptionText:
                  type: string
                treatmentOrders:
                  type: string
                notes:
                  type: string
                status:
                  type: string
                  enum: [DONE, FOLLOW_UP]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /medical-records/appointments/{appointment_id}:
    post:
      tags:
        - Medical Records
      summary: Tạo hồ sơ y tế
      parameters:
        - name: appointment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - diagnosis
                - prescriptionText
                - treatmentOrders
                - notes
                - status
              properties:
                diagnosis:
                  type: string
                prescriptionText:
                  type: string
                treatmentOrders:
                  type: string
                notes:
                  type: string
                status:
                  type: string
                  enum: [DONE, FOLLOW_UP]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      tags:
        - Notifications
      summary: Danh sách thông báo
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    patch:
      tags:
        - Notifications
      summary: Đánh dấu đã xem
      responses:
        "200":
          description: Success
  /public/specialties:
    get:
      tags:
        - Public
      summary: Danh sách chuyên khoa
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: keywords
          in: query
          schema:
            type: string
        - name: ctaLabel
          in: query
          schema:
            type: string
            enum: [CK1, CK2, CK3]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Specialty"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
  /public/specialties/{specialty_id}:
    get:
      tags:
        - Public
      summary: Chi tiết chuyên khoa
      security: []
      parameters:
        - name: specialty_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Specialty"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/doctors:
    get:
      tags:
        - Public
      summary: Danh sách bác sĩ
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: keywords
          in: query
          schema:
            type: string
        - name: specialtyId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            firstName:
                              type: string
                            lastName:
                              type: string
                            avatar:
                              type: string
                            gender:
                              type: string
                              enum: [MALE, FEMALE, OTHER, NOT_SET]
                            title:
                              type: string
                            specialtyId:
                              type: integer
                            bio:
                              type: string
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"
  /public/doctors/{doctor_id}:
    get:
      tags:
        - Public
      summary: Chi tiết bác sĩ
      security: []
      parameters:
        - name: doctor_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  firstName:
                    type: string
                  lastName:
                    type: string
                  email:
                    type: string
                    format: email
                  profile:
                    type: object
                    properties:
                      avatar:
                        type: string
                      dateOfBirth:
                        type: string
                        format: date
                      gender:
                        type: string
                        enum: [MALE, FEMALE, OTHER, NOT_SET]
                      phone:
                        type: string
                      title:
                        type: string
                      specialtyId:
                        type: integer
                      bio:
                        type: string
                  workSchedule:
                    $ref: "#/components/schemas/WorkSchedule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/doctors/{doctor_id}/time-slots:
    get:
      tags:
        - Public
      summary: Khung giờ trống
      security: []
      parameters:
        - name: doctor_id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: string
                      format: date-time
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
