name: Chạy kiểm tra tĩnh tổng hợp

on: 
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches-ignore:
      - 'main'
  schedule:
    - cron: '0 0 * * *'

jobs:
  backend-linting-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cài đặt gói thư viện
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install import-linter pylint

      - name: Chạy lint-imports
        working-directory: ./backend
        run: lint-imports

      - name: Chạy pylint
        working-directory: ./backend
        run: pylint src/


  frontend-linting-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Cài đặt gói thư viện
        working-directory: ./frontend
        run: npm ci

      - name: Kiểm tra Eslint
        working-directory: ./frontend
        run: npm run lint

  backend-security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'        

      - name: Cài đặt Bandit
        run: pip install bandit

      - name: Chạy Bandit
        run: bandit -c .github/configs/bandit.yaml -r backend

  frontend-security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Cài đặt dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Chạy npm audit
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
    
  docker-static-test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Tạo file .env ảo
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
      
      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile
          failure-threshold: error 

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile
          failure-threshold: error 

      - name: Đánh giá syntax docker compose and docker file
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker build --check ./backend
          docker build --check ./frontend

      - name: Build containers in production mode 
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait

      - name: Dọn dẹp containers
        if: always()
        run: docker compose down -v

  static-analysis-report:
    runs-on: ubuntu-latest
    needs: [backend-linting-check, frontend-linting-check, backend-security-check, frontend-security-check, docker-static-test]
    if: always()
    
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      
      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Chạy script 
        env:
          BACKEND_LINT: ${{ needs.backend-linting-check.result }}
          FRONTEND_LINT: ${{ needs.frontend-linting-check.result }}
          BACKEND_SECURITY_CHECK: ${{ needs.backend-security-check.result }}
          FRONTEND_SECURITY_CHECK: ${{ needs.frontend-security-check.result }}
          DOCKER_BUILD_CHECK: ${{ needs.docker-static-test.result }}
        run: python .github/workflows/scripts/static_report_scripts.py

      - name: Tạo GitHub Issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          chmod +x .github/workflows/scripts/static_report_issue_create.sh
          bash .github/workflows/scripts/static_report_issue_create.sh
