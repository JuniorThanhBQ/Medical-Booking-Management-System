name: Kiểm tra tĩnh bảo mật và linting code 

on:
  workflow_call:

jobs:
  static-code-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup môi trường Node.js và Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cài đặt Dependencies
        run: |
          cd frontend && npm ci && cd ..
          pip install -r backend/requirements/dev-requirements.txt
          pip install pip-audit

      - name: Kiểm tra linting
        run: |
          cd frontend && npm run lint && cd ..
          cd backend && lint-imports && pylint src/
          xenon --max-absolute B --max-modules B --max-average A src/

      - name: Kiểm tra bảo mật  
        run: |
          cd frontend && npm audit --omit=dev --audit-level=high && cd ..
          cd backend && bandit -c ../.github/configs/bandit.yaml -r . && cd ..
          pip-audit -r backend/requirements/requirements.txt

      - name: Quét bảo mật Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
