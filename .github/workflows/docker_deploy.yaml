name: Triển khai Docker Image lên Docker Hub

on:
  push:
    branches: [ main ] 

jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Triển khai Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:${{ github.sha }}

      - name: Triển khai Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:${{ github.sha }}