name: Pull Request Auto Tagging

on:
  push:
    branches: [ 'main', 'release' ]
  pull_request:
    branches: [ 'main', 'release', 'develop' ]

jobs:
  commit-lint-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check commitlint regex in the commit message   
        run: |
          CONTENT="${{ github.event.pull_request.title || github.event.head_commit.message }}"
          REGEX="(feature|rework|refactor|docs|patch|hotfix|fix|enhancement|documentation|chore|feat|release|other)"
          
          if [[ ! $CONTENT =~ $REGEX ]]; then
            echo "Missing one required tag in commit message!"
            exit 1
          fi

  tag-version-update:
    needs: commit-lint-tag
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push SemVer Version
        id: tag_version
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          MAJOR_STRING_TOKEN: "release"
          MINOR_STRING_TOKEN: "feature,feat,enhancement"
          PATCH_STRING_TOKEN: "fix,patch,hotfix,rework,refactor,docs,documentation,chore,other"
          DEFAULT_BUMP: patch