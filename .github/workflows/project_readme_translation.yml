# .github/workflows/gemini-translate.yml
name: Gemini Translate

on:
  issue_comment:
    types: [ created ]

jobs:
  gemini_translate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gemini Translate
        if: |
          contains(github.event.comment.body, '/gemini-translate') || 
          contains(github.event.comment.body, '/gt')
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read README.vi.md.
            Translate it into English.
            Save the result as README.md.