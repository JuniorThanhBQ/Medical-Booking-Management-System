name: Build ứng dụng frontend và backend thủ công

on:
  workflow_call:
    secrets:
        VITE_API_URL:
          required: true

jobs:
  app-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup môi trường Node.js và Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cài đặt và build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Cài đặt và build backend
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          if [ -f .env.example ]; then 
            cp .env.example .env; 
          else 
            touch .env; 
          fi
          python -m compileall src/
