name: Chạy các kiểm tra pytest

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài đặt thư viện
        run: pip install pytest

      - name: Chạy Pytest
        id: pytest_step
        run: |
          pytest -v > pytest_log.txt 2>&1 || exit_code=$?
          exit_code=${exit_code:-0}

          if [ $exit_code -eq 5 ]; then
            exit 0
          elif [ $exit_code -ne 0 ]; then
            cat pytest_log.txt
            exit $exit_code
          else
            exit 0
          fi
        
      - name: Cấp quyền chạy script
        if: failure()
        run: chmod +x scripts/create_pytest_issue.sh

      - name: Tạo GitHub Issue báo cáo lỗi
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'Local' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: ./scripts/create_pytest_issue.sh