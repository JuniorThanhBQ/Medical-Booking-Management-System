name: Deploy frontend and backend images to registry

on:
  workflow_call:
    secrets:
        DOCKER_USERNAME:
          required: true
        DOCKER_PASSWORD:
          required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:${{ github.sha }}

      - name: Build và Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:${{ github.sha }}
            