name: Chạy các bài kiểm tra chất lượng QA

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pytest-test:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài đặt thư viện pytest và pytest-cov
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Tạo file .env 
        working-directory: ./backend
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Chạy Pytest
        id: pytest_step
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend/src

          python -m pytest -v --cov=. --cov-report=term-missing > pytest_log.txt 2>&1 || exit_code=$?
          exit_code=${exit_code:-0}

          if [ $exit_code -eq 5 ]; then
            exit 0
          elif [ $exit_code -ne 0 ]; then
            cat pytest_log.txt
            exit $exit_code
          else
            cat pytest_log.txt | grep -E "Name|Stmts|Miss|Cover|TOTAL"
            exit 0
          fi
        
      - name: Cấp quyền chạy script
        if: failure()
        run: chmod +x .github/workflows/scripts/pytest_issue_create.sh

      - name: Tạo GitHub Issue báo cáo lỗi
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'Local' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/workflows/scripts/pytest_issue_create.sh