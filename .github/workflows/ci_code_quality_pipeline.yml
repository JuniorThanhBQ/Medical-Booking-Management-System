name: Đảm bảo chất lượng code Pytest

on:
  workflow_call:

jobs:
  pytest-backend-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cài đặt thư viện 
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install pytest pytest-cov
          if [ -f .env.example ]; 
            then cp .env.example .env;
          else 
            touch .env;
          fi

      - name: Chạy Pytest
        working-directory: ./backend
        run: |
          chmod +x ../.github/workflows/scripts/pytest_run_test.sh
          bash ../.github/workflows/scripts/pytest_run_test.sh

      - name: Báo cáo lỗi nếu thất bại
        if: failure()
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'Local' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x ../.github/workflows/scripts/pytest_pull_request_comment.sh
          bash ../.github/workflows/scripts/pytest_pull_request_comment.sh
