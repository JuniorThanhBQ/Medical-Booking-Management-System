name: Unit and Integration Test 

on:
  workflow_call:

jobs:
  pytest-backend-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install lib
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install pytest pytest-cov
          if [ -f .env.example ]; 
            then cp .env.example .env;
          else 
            touch .env;
          fi

      - name: Chạy Pytest
        working-directory: ./backend
        run: |
          chmod +x ../.github/workflows/scripts/pytest_run_test.sh
          bash ../.github/workflows/scripts/pytest_run_test.sh

      - name: Báo cáo lỗi nếu thất bại
        if: failure()
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'Local' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x ../.github/workflows/scripts/pytest_pull_request_comment.sh
          bash ../.github/workflows/scripts/pytest_pull_request_comment.sh
