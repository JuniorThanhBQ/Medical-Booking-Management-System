name: Chạy kiểm tra chất lượng QA

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches-ignore:
      - 'main'

jobs:
  build-check:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt thư viện Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài đặt thư viện Backend
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt

      - name: Tạo file .env 
        working-directory: ./backend
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build backend
        working-directory: ./backend
        run: |
          python -m src.index

  pytest-test:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài đặt thư viện pytest và pytest-cov
        working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install pytest pytest-cov

      - name: Tạo file .env 
        working-directory: ./backend
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Chạy Pytest
        id: pytest_step
        run: |
          chmod +x .github/workflows/scripts/pytest_run_test.sh
          bash .github/workflows/scripts/pytest_run_test.sh
        
      - name: Cấp quyền chạy script
        if: failure()
        run: chmod +x .github/workflows/scripts/pytest_issue_create.sh

      - name: Tạo GitHub Issue báo cáo lỗi
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'Local' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/workflows/scripts/pytest_issue_create.sh