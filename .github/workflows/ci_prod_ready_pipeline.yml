name: Production-ready CI Pipeline

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ] 

jobs:
  backend-linting-check-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install import-linter pylint
      - working-directory: ./backend
        run: lint-imports
      - working-directory: ./backend
        run: pylint src/

  frontend-linting-check-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - working-directory: ./frontend
        run: npm ci
      - working-directory: ./frontend
        run: npm run lint

  backend-security-check-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'        
      - run: pip install bandit
      - run: bandit -c .github/configs/bandit.yaml -r backend

  frontend-security-check-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - working-directory: ./frontend
        run: npm ci
      - working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
    
  docker-static-test-prod:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./backend/Dockerfile
          failure-threshold: error 
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./frontend/Dockerfile
          failure-threshold: error 
      - run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker build --check ./backend
          docker build --check ./frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - if: always()
        run: docker compose down -v

  pytest-test-prod:
    runs-on: ubuntu-latest
    needs: [backend-linting-check-prod, frontend-linting-check-prod, backend-security-check-prod, frontend-security-check-prod, docker-static-test-prod]
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: ./backend
        run: |
          pip install -r requirements/requirements.txt
          pip install pytest pytest-cov
      - working-directory: ./backend
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
      - id: pytest_step
        run: |
          chmod +x .github/workflows/scripts/pytest_run_test.sh
          bash .github/workflows/scripts/pytest_run_test.sh

  test-build-prod:
    runs-on: ubuntu-latest
    needs: [pytest-test-prod, backend-linting-check-prod, frontend-linting-check-prod, backend-security-check-prod, frontend-security-check-prod, docker-static-test-prod]
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - if: failure()
        run: | 
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
      - run: docker compose down -v

  build-deploy-backend-prod:
    needs: test-build-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          context: .                           
          file: ./backend/Dockerfile  
          load: true
          tags: backend:scan
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend:scan'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          context: .                           
          file: ./backend/Dockerfile  
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-backend:${{ github.sha }}

  build-deploy-frontend-prod:
    needs: test-build-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          context: ./frontend 
          load: true
          build-args: |
            VITE_API_URL=${{ secrets.BACKEND_DEV_API_URL }}
          tags: frontend:scan
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend:scan'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          context: ./frontend 
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.BACKEND_DEV_API_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/medical-appointment-b3-8-frontend:${{ github.sha }}
    
  check-deployed-images-prod:
    needs: [build-deploy-backend-prod, build-deploy-frontend-prod]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
      - run: docker compose down -v

  full-production-report:
    runs-on: ubuntu-latest
    needs: [backend-linting-check-prod, frontend-linting-check-prod, backend-security-check-prod, frontend-security-check-prod, docker-static-test-prod, pytest-test-prod, test-build-prod, build-deploy-backend-prod, build-deploy-frontend-prod, check-deployed-images-prod]
    if: always()
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - env:
          BACKEND_LINT: ${{ needs.backend-linting-check-prod.result }}
          FRONTEND_LINT: ${{ needs.frontend-linting-check-prod.result }}
          BACKEND_SECURITY: ${{ needs.backend-security-check-prod.result }}
          FRONTEND_SECURITY: ${{ needs.frontend-security-check-prod.result }}
          DOCKER_STATIC: ${{ needs.docker-static-test-prod.result }}
          PYTEST_TEST: ${{ needs.pytest-test-prod.result }}
          TEST_BUILD: ${{ needs.test-build-prod.result }}
          DEPLOY_BACKEND: ${{ needs.build-deploy-backend-prod.result }}
          DEPLOY_FRONTEND: ${{ needs.build-deploy-frontend-prod.result }}
          CHECK_IMAGES: ${{ needs.check-deployed-images-prod.result }}
        run: python .github/workflows/scripts/static_report_scripts.py
      - run: cat issue.md >> $GITHUB_STEP_SUMMARY
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = fs.readFileSync('issue.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: issueBody
            })