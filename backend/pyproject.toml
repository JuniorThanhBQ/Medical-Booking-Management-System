[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Van Trung Thanh", email = "thanh.vantrung2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "amqp>=5.4.1",
    "aniso8601>=10.0.1",
    "attrs>=26.1.0",
    "billiard>=4.3.1",
    "blinker>=1.9.0",
    "cachelib>=0.17.0",
    "celery>=5.6.3",
    "certifi>=2026.10.23",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.2",
    "click>=8.5.0",
    "click-didyoumean>=0.3.1",
    "click-plugins>=1.1.1.2",
    "click-repl>=0.4.1",
    "cloudinary>=1.46.3",
    "colorama>=0.4.6",
    "cryptography>=50.0.2",
    "dependency-injector>=4.49.1",
    "deprecated>=3.0.0",
    "flask>=3.1.3",
    "flask-admin>=2.2.1",
    "flask-caching>=2.5.1",
    "flask-cors>=6.0.5",
    "flask-jwt-extended>=4.7.4",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-redis>=0.4.0",
    "flask-restx>=1.3.2",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "greenlet>=3.5.6",
    "gunicorn>=26.2.0",
    "idna>=3.20",
    "importlib-resources>=7.1.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "jsonschema-specifications>=2025.9.1",
    "kombu>=5.6.2",
    "limits>=5.8.0",
    "mako>=1.4.3",
    "markupsafe>=3.0.4",
    "ordered-set>=4.1.0",
    "packaging>=26.3",
    "prompt-toolkit>=3.0.53",
    "pycparser>=3.12",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dateutil>=3.0.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "referencing>=0.37.0",
    "requests>=2.34.2",
    "rpds-py>=2026.9.1",
    "six>=1.17.0",
    "sqlalchemy>=2.1.6",
    "typing-extensions>=4.16.0",
    "tzdata>=2026.5",
    "tzlocal>=5.4.5",
    "urllib3>=2.8.0",
    "vine>=5.1.0",
    "wcwidth>=0.9.4",
    "werkzeug>=3.1.9",
    "whitenoise>=6.12.0",
    "wrapt>=2.5.1",
    "wtforms>=3.3.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "routers",
    "views",
    "services",
    "repositories",
    "models"
]
containers = [
    "src.modules.users",
    "src.modules.appointments",
    "src.modules.doctors",
    "src.modules.medical_records",
    "src.modules.notification"
]

[[tool.importlinter.contracts]]
name = "Service independence"
type = "independence"
modules = [
    "src.modules.users.services",
    "src.modules.appointments.services",
    "src.modules.doctors.services",
    "src.modules.medical_records.services",
    "src.modules.notification.services"
]


[[tool.importlinter.contracts]]
name = "Views independence"
type = "independence"
modules = [
    "src.modules.users.views",
    "src.modules.appointments.views",
    "src.modules.doctors.views",
    "src.modules.medical_records.views",
    "src.modules.notification.views"
]

[tool.pylint.master]
init-hook = "import sys; sys.path.insert(0, './')"

[tool.pylint.main]
ignore = ["venv"]
jobs = 2

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "W0718", # broad-exception-caught
    "R0801",
    "W1203", # logging-fstring-interpolation
    "E1102",
    "C0121", # singleton-comparison
    "I1101"
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7
max-attributes=8
max-locals = 17
max-returns = 8
max-branches = 13
max-statements = 50

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_"]

[tool.pylint.reports]
output-format = "colorized"
reports = false
score = false

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=50"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["src/dependency_injector/*"]
